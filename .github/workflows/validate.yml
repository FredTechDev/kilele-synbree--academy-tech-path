name: Validate curriculum repository

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: python3 -m pip install -r 12-platform/requirements.txt

      - name: Validate documentation, examples and platform
        run: bash scripts/check-all.sh
